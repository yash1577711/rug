{% extends 'base.html' %}
{% block title %}Payment Cancelled | KaleenBaba{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto text-center py-16">
  <div class="text-red-500 text-6xl mb-6">
    <i class="fas fa-times-circle"></i>
  </div>
  <h2 class="text-3xl font-bold text-gray-800 mb-4">Payment Cancelled</h2>
  <p class="text-gray-600 mb-6">Your payment was cancelled. You can try again or contact us for assistance.</p>
  <div class="space-x-4">
    <a href="javascript:history.back()" class="bg-gray-600 hover:bg-gray-700 text-white px-6 py-3 rounded-lg font-medium">
      Try Again
    </a>
    <a href="/" class="bg-amber-600 hover:bg-amber-700 text-white px-6 py-3 rounded-lg font-medium">
      Home
    </a>
  </div>
</div>
{% endblock %}
