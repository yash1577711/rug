{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password | RugCraft{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-16">
  <div class="card p-8">
    <h2 class="text-2xl font-bold text-center mb-2">Reset Your Password</h2>
    <p class="text-gray-600 text-center mb-8">Enter your email address and we'll send you a link to reset your password.</p>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <input type="email" name="email" placeholder="Email address" required
               class="form-input">
      </div>
      <button type="submit" class="btn btn-primary w-full">Send Reset Link</button>
    </form>

    <p class="text-center mt-6 text-gray-600">
      Remembered your password? 
      <a href="{% url 'account_login' %}" class="text-amber-700 font-medium hover:underline">Sign In</a>
    </p>
  </div>
</div>
{% endblock %}
