{% extends 'base.html' %}
{% load account static %}

{% block title %}Sign In | KaleenBaba{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-16">
  <div class="card p-8">
    <h2 class="text-2xl font-bold text-center mb-2">Welcome to KaleenBaba</h2>
    <p class="text-gray-600 text-center mb-8">Sign in to your account</p>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <input type="email" name="login" placeholder="Email address" required
               class="form-input">
      </div>
      <div>
        <input type="password" name="password" placeholder="Password" required
               class="form-input">
      </div>
      <button type="submit" class="btn btn-primary w-full">Sign In</button>
    </form>

    <p class="text-center mt-6 text-gray-600">
      Don't have an account? 
      <a href="{% url 'account_signup' %}" class="text-amber-700 font-medium hover:underline">Sign Up</a>
    </p>
    
    <p class="text-center mt-4 text-gray-600">
      <a href="{% url 'account_reset_password' %}" class="text-amber-700 font-medium hover:underline">Forgot your password?</a>
    </p>
  </div>
</div>
{% endblock %}
