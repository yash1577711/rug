{% extends 'base.html' %}
{% load static %}

{% block title %}Change Password | RugCraft{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-16">
  <div class="card p-8">
    <h2 class="text-2xl font-bold text-center mb-2">Change Your Password</h2>
    <p class="text-gray-600 text-center mb-8">Enter your current password and new password below.</p>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <input type="password" name="oldpassword" placeholder="Current password" required
               class="form-input">
      </div>
      <div>
        <input type="password" name="newpassword1" placeholder="New password" required
               class="form-input">
      </div>
      <div>
        <input type="password" name="newpassword2" placeholder="Confirm new password" required
               class="form-input">
      </div>
      <button type="submit" class="btn btn-primary w-full">Change Password</button>
    </form>

    <p class="text-center mt-6 text-gray-600">
      <a href="{% url 'account_login' %}" class="text-amber-700 font-medium hover:underline">← Back to Sign In</a>
    </p>
  </div>
</div>
{% endblock %}
