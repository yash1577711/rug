{% extends 'base.html' %}
{% load account static %}

{% block title %}Create Account | KaleenBaba{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-16">
  <div class="card p-8">
    <h2 class="text-2xl font-bold text-center mb-2">Join KaleenBaba</h2>
    <p class="text-gray-600 text-center mb-8">Create your account to explore our collection</p>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <input type="email" name="email" placeholder="Email" required
               class="form-input">
      </div>
      <div>
        <input type="password" name="password1" placeholder="Password" required
               class="form-input">
      </div>
      <div>
        <input type="password" name="password2" placeholder="Confirm Password" required
               class="form-input">
      </div>
      <button type="submit" class="btn btn-primary w-full">Create Account</button>
    </form>

    <p class="text-center mt-6 text-gray-600">
      Already have an account? 
      <a href="{% url 'account_login' %}" class="text-amber-700 font-medium hover:underline">Sign In</a>
    </p>
  </div>
</div>
{% endblock %}
