{% extends 'base.html' %}
{% load static %}

{% block title %}Set New Password | RugCraft{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-16">
  <div class="card p-8">
    <h2 class="text-2xl font-bold text-center mb-2">Set New Password</h2>
    <p class="text-gray-600 text-center mb-8">Enter your new password below.</p>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <input type="password" name="new_password1" placeholder="New password" required
               class="form-input">
      </div>
      <div>
        <input type="password" name="new_password2" placeholder="Confirm new password" required
               class="form-input">
      </div>
      <div class="flex space-x-4">
        <a href="/" class="flex-1 btn btn-secondary">Cancel</a>
        <button type="submit" class="flex-1 btn btn-primary">Set New Password</button>
      </div>
    </form>

    <p class="text-center mt-6 text-gray-600">
      Remembered your password? 
      <a href="{% url 'account_login' %}" class="text-amber-700 font-medium hover:underline">Sign In</a>
    </p>
  </div>
</div>
{% endblock %}
