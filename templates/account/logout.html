{% extends 'base.html' %}
{% load static %}  <!-- ✅ Only load static -->

{% block title %}Sign Out | RugCraft{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-16">
  <div class="card p-8 text-center">
    <h2 class="text-2xl font-bold mb-4">Sign Out</h2>
    <p class="text-gray-700 mb-6">Are you sure you want to sign out?</p>
    
    <form method="post">
      {% csrf_token %}
      <div class="flex space-x-4">
        <a href="/" class="flex-1 btn btn-secondary">Cancel</a>
        <button type="submit" class="flex-1 btn btn-primary">Sign Out</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
