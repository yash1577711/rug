<!-- templates/core/trade.html -->
{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto my-16 px-4">
  <div class="card p-8">
    <h1 class="text-3xl font-bold text-center mb-2">Partner With Us</h1>
    <p class="text-gray-600 text-center mb-8">For bulk orders, retailers, and global distributors</p>

    {% if messages %}
      {% for message in messages %}
        <div class="mb-4 p-3 bg-green-100 text-green-800 rounded-lg">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <input type="text" name="name" placeholder="Full Name" required class="form-input">
      </div>
      <div>
        <input type="email" name="email" placeholder="Business Email" required class="form-input">
      </div>
      <div>
        <input type="tel" name="phone" placeholder="Phone Number" required class="form-input">
      </div>
      <div>
        <input type="text" name="company" placeholder="Company Name" required class="form-input">
      </div>
      <div>
        <textarea name="message" placeholder="Tell us about your requirements..." rows="4" class="form-input"></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-full">Submit Inquiry</button>
    </form>
  </div>
</div>
{% endblock %}
